# RBT-133 (spike, branch wasm-determinism-spike only): cross-platform determinism probes.
# Step 1 locates the ARM<->x86 divergence with native MuJoCo/numpy; later jobs run the WASM build.
name: rbt133-wasm-spike
on:
  push:
    branches: [wasm-determinism-spike]
    paths: ['spikes/wasm/**', '.github/workflows/rbt133-wasm-spike.yml']
  workflow_dispatch:
jobs:
  locate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.4.6 mujoco==3.14.0 && pip install --no-deps -e .
      - run: spikes/wasm/locate/ci.sh out/locate-${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: locate-${{ matrix.os }}
          path: out/
