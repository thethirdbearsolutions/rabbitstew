[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbitstew"
version = "0.1.0"
description = "Robotic Artificial Brain/Body-Intertwined Simulation Toolkit and Evolution Workshop"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mujoco>=3.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rabbitstew = "rabbitstew.cli:main"

[tool.setuptools.packages.find]
include = ["rabbitstew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
